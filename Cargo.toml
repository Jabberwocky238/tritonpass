[package]
name = "tritonpass"
version = "0.1.1"
edition = "2024"
description = "Triton TTIR to block-level standard MLIR (func / arith / math / scf / memref / linalg) on the mlirformat / mlirpass stack"
license = "MIT"
repository = "https://github.com/Jabberwocky238/tritonpass"
keywords = ["triton", "mlir", "compiler"]
categories = ["compilers"]
readme = "README.md"
# 子模块（Triton 源码，只为钉版本与生成）与对拍夹具（十几 MB）不进发布包
exclude = ["third_party/", "tests/", "scripts/"]

[dependencies]
mlirformat = { version = "=0.6.3", default-features = false }
# 0.8 起方言的 fold / 规范化 / 变换按 feature 开关；只开 std 时 canonicalize 几乎什么都不做，要 all-dialects
mlirpass = { version = "=0.8.5", default-features = false, features = ["std", "all-dialects"] }
moremath = { version = "=0.2.1", default-features = false }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
